name: PR format check

on:
  pull_request:
    branches:
      - main

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            access-tokens = code.forgejo.org=${{ secrets.FORGEJO_TOKEN }}

      - name: Check Nix formatting
        run: nix fmt -- --check .
