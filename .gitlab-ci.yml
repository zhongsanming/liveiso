image: nixos/nix:2.24.2

variables:
  NIX_CONFIG: "experimental-features = nix-command flakes"

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'

build:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - nix build .#live -o result
    - mkdir -p dist
    - find result -type f -name '*.iso' -exec cp -v {} dist/ \;
  artifacts:
    name: "$CI_COMMIT_REF_SLUG-live-iso"
    paths:
      - dist/
    expire_in: 4 weeks

format:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
  script:
    - nix fmt -- --check .
